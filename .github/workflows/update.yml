name: Update Bus Timetable Database

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run script
        run: uv run main.py
      - name: Generate ISO 8601 timestamp
        id: timestamp
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Prepare gh-pages directory
        run: |
          mkdir dist
          mv timetable.json dist/
      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || echo "Branch gh-pages not found, will create it."
          git checkout gh-pages || git checkout --orphan gh-pages
          git rm -rf . || true
          cp dist/timetable.json ./
          git add timetable.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update: ${{ steps.timestamp.outputs.time }}"
          git push origin HEAD:gh-pages